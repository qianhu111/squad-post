<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">复活层级</title><desc id="dsc">主基地到 FOB 电台、HAB 兵站和队包的层级关系及距离提示。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">复活层级：主基地、FOB、HAB、队包</text><rect x="55" y="215" width="70" height="70" rx="10" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/><text x="90" y="305" class="s" text-anchor="middle">主基地</text><line x1="130" y1="250" x2="292" y2="250" stroke="#1f5d78" stroke-width="3" marker-end="url(#ar-blue)"/><text x="211" y="236" class="s" text-anchor="middle" fill="#1f5d78">≥400 米</text><circle cx="390" cy="250" r="112" fill="none" stroke="#1f5d78" stroke-width="2" stroke-dasharray="8 6"/><rect x="358" y="222" width="64" height="56" rx="8" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/><text x="390" y="208" class="s" text-anchor="middle">FOB 电台</text><rect x="368" y="234" width="44" height="32" rx="5" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="390" y="288" class="s" text-anchor="middle">HAB</text><text x="390" y="330" class="s" text-anchor="middle" fill="#1f5d78">建造圈 150 米</text><line x1="505" y1="250" x2="638" y2="250" stroke="#2f7d5b" stroke-width="3" marker-end="url(#ar-green)"/><text x="571" y="236" class="s" text-anchor="middle" fill="#2f7d5b">小队</text><circle cx="690" cy="250" r="48" fill="#eaf5ef" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6 5"/><path d="M690 214 v34" stroke="#2f7d5b" stroke-width="3"/><path d="M690 214 l17 8 -17 8z" fill="#2f7d5b"/><text x="690" y="322" class="s" text-anchor="middle" fill="#2f7d5b">队包</text><text x="690" y="342" class="s" text-anchor="middle">60 秒一波</text><text x="40" y="410" class="s" text-anchor="start" fill="#5b6875">越靠前复活越快，但越容易被压制、被踩或被毁。</text>
</svg>
