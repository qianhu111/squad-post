<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">丛林队距随视线变化</title><desc id="dsc">极密灌木三到五米，密林五到十米，疏林十五到二十五米，林间空地三十米以上。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.m{font-size:15px}.l{font-size:16px;font-weight:700}.t{font-size:21px;font-weight:800}</style>
<text x="40" y="40" class="t">视线越短，队距越紧，但不能挤成一串</text>
<rect x="40" y="65" width="180" height="300" rx="10" fill="#e3ece4" stroke="#a9bfae" stroke-width="2"/>
<rect x="225" y="65" width="180" height="300" rx="10" fill="#dce8dd" stroke="#a9bfae" stroke-width="2"/>
<rect x="410" y="65" width="180" height="300" rx="10" fill="#eef3e8" stroke="#a9bfae" stroke-width="2"/>
<rect x="595" y="65" width="165" height="300" rx="10" fill="#f4f1e6" stroke="#c9bfa3" stroke-width="2"/>
<text x="130" y="92" class="m" text-anchor="middle" fill="#2f7d5b">极密灌木</text>
<text x="315" y="92" class="m" text-anchor="middle" fill="#2f7d5b">密林</text>
<text x="500" y="92" class="m" text-anchor="middle" fill="#2f7d5b">疏林</text>
<text x="677" y="92" class="m" text-anchor="middle" fill="#8a7a63">空地边缘</text>
<g fill="#2f7d5b">
<circle cx="130" cy="150" r="12"/><circle cx="130" cy="185" r="12"/><circle cx="130" cy="220" r="12"/><circle cx="130" cy="255" r="12"/>
<circle cx="315" cy="140" r="12"/><circle cx="315" cy="195" r="12"/><circle cx="315" cy="250" r="12"/>
<circle cx="500" cy="135" r="12"/><circle cx="500" cy="215" r="12"/><circle cx="500" cy="295" r="12"/>
<circle cx="677" cy="140" r="12"/><circle cx="677" cy="240" r="12"/><circle cx="677" cy="340" r="12"/>
</g>
<g stroke="#b42318" stroke-width="2">
<line x1="145" y1="150" x2="145" y2="185"/><line x1="145" y1="185" x2="145" y2="220"/><line x1="145" y1="220" x2="145" y2="255"/>
<line x1="330" y1="140" x2="330" y2="195"/><line x1="330" y1="195" x2="330" y2="250"/>
<line x1="515" y1="135" x2="515" y2="215"/><line x1="515" y1="215" x2="515" y2="295"/>
<line x1="692" y1="140" x2="692" y2="240"/><line x1="692" y1="240" x2="692" y2="340"/>
</g>
<text x="155" y="215" class="s" fill="#b42318">3–5 米</text>
<text x="340" y="210" class="s" fill="#b42318">5–10 米</text>
<text x="525" y="250" class="s" fill="#b42318">15–25 米</text>
<text x="700" y="290" class="s" fill="#b42318">30 米+</text>
<text x="130" y="330" class="s" text-anchor="middle" fill="#5b6875">一梭子</text>
<text x="130" y="350" class="s" text-anchor="middle" fill="#5b6875">不能打两人</text>
<text x="315" y="330" class="s" text-anchor="middle" fill="#5b6875">看得见前后</text>
<text x="315" y="350" class="s" text-anchor="middle" fill="#5b6875">不在同一直线</text>
<text x="500" y="330" class="s" text-anchor="middle" fill="#5b6875">两翼略展开</text>
<text x="500" y="350" class="s" text-anchor="middle" fill="#5b6875">转弯停一下</text>
<text x="677" y="370" class="s" text-anchor="middle" fill="#5b6875">先看十秒</text>
<text x="677" y="390" class="s" text-anchor="middle" fill="#5b6875">再一次通过</text>
<rect x="40" y="385" width="540" height="45" rx="8" fill="#ffffff" stroke="#c7d3dc" stroke-width="2"/>
<text x="58" y="413" class="s" fill="#16212b">判断标准：一梭子能不能同时打到两个人；转弯时还能不能看见前一人。</text>
</svg>
