<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">丛林侧翼与节点</title><desc id="dsc">丛林中视线很短，队伍沿节点推进，侧翼需要单独观察。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">丛林：短视线把侧翼和节点放大</text><circle cx="90" cy="110" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="90" cy="110" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="180" cy="90" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="180" cy="90" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="260" cy="130" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="260" cy="130" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="120" cy="210" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="120" cy="210" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="210" cy="200" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="210" cy="200" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="300" cy="230" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="300" cy="230" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="90" cy="320" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="90" cy="320" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="180" cy="330" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="180" cy="330" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="280" cy="320" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="280" cy="320" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="380" cy="110" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="380" cy="110" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="470" cy="90" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="470" cy="90" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="560" cy="120" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="560" cy="120" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="640" cy="160" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="640" cy="160" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="700" cy="250" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="700" cy="250" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="600" cy="300" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="600" cy="300" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="500" cy="340" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="500" cy="340" r="11" fill="#2f7d5b" opacity="0.55"/><circle cx="400" cy="360" r="26" fill="#2f7d5b" opacity="0.18"/><circle cx="400" cy="360" r="11" fill="#2f7d5b" opacity="0.55"/><path d="M120 380 C220 340 280 300 360 260 C440 220 520 190 620 150" fill="none" stroke="#1f5d78" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#ar-blue)"/><circle cx="120" cy="380" r="11" fill="#1f5d78"/><circle cx="360" cy="260" r="11" fill="#1f5d78"/><circle cx="620" cy="150" r="11" fill="#1f5d78"/><text x="120" y="410" class="s" text-anchor="middle" fill="#1f5d78">小队</text><text x="360" y="240" class="s" text-anchor="middle" fill="#1f5d78">节点</text><line x1="740" y1="320" x2="540" y2="240" stroke="#b42318" stroke-width="3" marker-end="url(#ar-red)"/><text x="700" y="350" class="s" text-anchor="middle" fill="#b42318">侧翼威胁</text><text x="560" y="80" class="s" text-anchor="middle" fill="#5b6875">短视线</text><text x="40" y="430" class="s" text-anchor="start" fill="#5b6875">队形收紧，侧翼先设观察；低频通信，用预设手势和节点回报。</text>
</svg>
