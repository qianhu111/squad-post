<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">视线、射线与爆炸掩护</title><desc id="dsc">三块面板分别说明墙体如何阻挡观察、子弹和爆炸破片。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">视线、射线、爆炸掩护不是一回事</text><rect x="20" y="70" width="240" height="340" rx="12" fill="#ffffff" stroke="#dfe6ee"/><text x="140" y="105" class="l" text-anchor="middle">视线</text><rect x="170" y="150" width="18" height="190" rx="3" fill="#5b6875"/><circle cx="100" cy="245" r="10" fill="#1f5d78"/><text x="100" y="275" class="s" text-anchor="middle">你</text><circle cx="225" cy="245" r="10" fill="#b42318"/><text x="225" y="275" class="s" text-anchor="middle">威胁</text><line x1="110" y1="245" x2="168" y2="245" stroke="#1f5d78" stroke-width="2" stroke-dasharray="6 5"/><path d="M161 236 l14 14 M175 236 l-14 14" stroke="#b42318" stroke-width="3"/><text x="140" y="360" class="s" text-anchor="middle" fill="#1f5d78">视线被墙截断</text><text x="140" y="388" class="s" text-anchor="middle" fill="#5b6875">看得到</text><rect x="280" y="70" width="240" height="340" rx="12" fill="#ffffff" stroke="#dfe6ee"/><text x="400" y="105" class="l" text-anchor="middle">射线</text><rect x="430" y="150" width="18" height="190" rx="3" fill="#5b6875"/><circle cx="360" cy="245" r="10" fill="#1f5d78"/><text x="360" y="275" class="s" text-anchor="middle">你</text><circle cx="485" cy="245" r="10" fill="#b42318"/><text x="485" y="275" class="s" text-anchor="middle">威胁</text><line x1="475" y1="245" x2="450" y2="245" stroke="#b42318" stroke-width="2" stroke-dasharray="6 5"/><path d="M441 236 l14 14 M455 236 l-14 14" stroke="#b42318" stroke-width="3"/><text x="400" y="360" class="s" text-anchor="middle" fill="#b42318">射线被墙挡住</text><text x="400" y="388" class="s" text-anchor="middle" fill="#5b6875">打得到</text><rect x="540" y="70" width="240" height="340" rx="12" fill="#ffffff" stroke="#dfe6ee"/><text x="660" y="105" class="l" text-anchor="middle">爆炸</text><rect x="690" y="150" width="18" height="190" rx="3" fill="#5b6875"/><circle cx="620" cy="245" r="10" fill="#1f5d78"/><text x="620" y="275" class="s" text-anchor="middle">你</text><circle cx="745" cy="245" r="10" fill="#b42318"/><text x="745" y="275" class="s" text-anchor="middle">威胁</text><circle cx="745" cy="245" r="30" fill="#fff1f0" stroke="#b42318" stroke-width="2"/><line x1="745" y1="245" x2="703" y2="245" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="787" y2="245" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="745" y2="203" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="745" y2="287" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="715" y2="215" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="775" y2="215" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="715" y2="275" stroke="#d97706" stroke-width="2"/><line x1="745" y1="245" x2="775" y2="275" stroke="#d97706" stroke-width="2"/><text x="660" y="360" class="s" text-anchor="middle" fill="#d97706">墙后挡破片</text><text x="660" y="388" class="s" text-anchor="middle" fill="#5b6875">炸得到</text>
</svg>
