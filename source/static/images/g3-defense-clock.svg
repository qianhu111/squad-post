<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">回防时间窗</title><desc id="dsc">按到达时间判断回防：30 秒内到立即回防，两分钟内到抢时间，超过两分钟守下一道线。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}.xs{font-size:12px}</style>
<text x="40" y="42" class="t" text-anchor="start">回防时间窗：赶得上，才谈守不守</text>

<rect x="80" y="96" width="300" height="52" rx="8" fill="#fff2dd" stroke="#d97706" stroke-width="2"/>
<text x="230" y="119" class="l" text-anchor="middle" fill="#b45309">拉白阶段</text>
<text x="230" y="138" class="s" text-anchor="middle">约 1–2 分钟（经验值）</text>
<rect x="380" y="96" width="340" height="52" rx="8" fill="#fde8e6" stroke="#b42318" stroke-width="2"/>
<text x="550" y="119" class="l" text-anchor="middle" fill="#b42318">占满阶段</text>
<text x="550" y="138" class="s" text-anchor="middle">再从白占到满，约 1–2 分钟</text>

<line x1="80" y1="168" x2="720" y2="168" stroke="#5b6875" stroke-width="2"/>
<line x1="80" y1="160" x2="80" y2="176" stroke="#5b6875" stroke-width="2"/>
<line x1="380" y1="160" x2="380" y2="176" stroke="#5b6875" stroke-width="2"/>
<line x1="720" y1="160" x2="720" y2="176" stroke="#5b6875" stroke-width="2"/>
<text x="80" y="194" class="s" text-anchor="middle" fill="#5b6875">0 分</text>
<text x="380" y="194" class="s" text-anchor="middle" fill="#5b6875">约 2 分</text>
<text x="720" y="194" class="s" text-anchor="middle" fill="#5b6875">约 4 分</text>

<rect x="40" y="224" width="226" height="120" rx="12" fill="#eaf5ef" stroke="#2f7d5b" stroke-width="2"/>
<text x="60" y="252" class="l" text-anchor="start" fill="#2f7d5b">30 秒内到</text>
<text x="60" y="278" class="s" text-anchor="start">立即回防，先到先占掩体</text>
<text x="60" y="300" class="s" text-anchor="start">阻止 60 票摆动</text>
<text x="60" y="322" class="s" text-anchor="start" fill="#5b6875">同时可能止住流血</text>

<rect x="287" y="224" width="226" height="120" rx="12" fill="#fff2dd" stroke="#d97706" stroke-width="2"/>
<text x="307" y="252" class="l" text-anchor="start" fill="#b45309">30 秒–2 分钟</text>
<text x="307" y="278" class="s" text-anchor="start">抢时间，先占外围</text>
<text x="307" y="300" class="s" text-anchor="start">别从正面排队进场</text>
<text x="307" y="322" class="s" text-anchor="start" fill="#5b6875">赶不上就转守下一道线</text>

<rect x="534" y="224" width="226" height="120" rx="12" fill="#fde8e6" stroke="#b42318" stroke-width="2"/>
<text x="554" y="252" class="l" text-anchor="start" fill="#b42318">超过 2 分钟</text>
<text x="554" y="278" class="s" text-anchor="start">基本赶不上拉穿</text>
<text x="554" y="300" class="s" text-anchor="start">不要排队送死</text>
<text x="554" y="322" class="s" text-anchor="start" fill="#5b6875">守下一道线，等反击窗口</text>

<rect x="40" y="364" width="720" height="56" rx="12" fill="#ffffff" stroke="#dfe6ee"/>
<text x="60" y="388" class="s" text-anchor="start" fill="#1f5d78">先问“赶得上吗”，再问“值多少票、要付多少、丢了会连锁什么”。</text>
<text x="60" y="408" class="s" text-anchor="start" fill="#5b6875">拉白和占满时间随人数、点位和层设置变化，这里只用于粗略判断“来不来得及”。</text>
<text x="40" y="442" class="xs" text-anchor="start" fill="#5b6875">回防的价值 = 避免 60 票摆动 + 可能止住的持续流血；反抢的价值 = 争取 60 票摆动。</text>
</svg>
