<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">迫击炮落点修正</title><desc id="dsc">观察位、目标与落点的关系，以及先方向后距离的修正顺序。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">迫击炮修正：一次只报一个方向和一个量</text><circle cx="120" cy="360" r="14" fill="#2f7d5b"/><text x="120" y="392" class="s" text-anchor="middle" fill="#2f7d5b">观察位</text><line x1="134" y1="352" x2="518" y2="214" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="5 5"/><path d="M508 204 l24 20 M532 204 l-24 20" stroke="#b42318" stroke-width="4"/><text x="532" y="205" class="s" text-anchor="#b42318">目标</text><circle cx="610" cy="278" r="13" fill="#d97706"/><text x="625" y="284" class="s" text-anchor="#d97706">落点</text><line x1="600" y1="270" x2="540" y2="250" stroke="#d97706" stroke-width="3" marker-end="url(#ar-amber)"/><text x="570" y="242" class="s" text-anchor="middle" fill="#d97706">左修 20 米</text><line x1="520" y1="240" x2="520" y2="214" stroke="#d97706" stroke-width="3" marker-end="url(#ar-amber)"/><text x="505" y="230" class="s" text-anchor="end" fill="#d97706">加 50 米</text><circle cx="700" cy="120" r="36" fill="#ffffff" stroke="#5b6875" stroke-width="2"/><path d="M700 90 v22 M700 128 v22 M670 120 h22 M708 120 h22" stroke="#5b6875" stroke-width="3"/><text x="700" y="78" class="s" text-anchor="middle" fill="#5b6875">方位</text><text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">先报方向，再报距离；炮手修正后再报下一次，不要一口气报三个变量。</text>
</svg>
