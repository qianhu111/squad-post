<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">队包三层距离</title><desc id="dsc">队包 15 米内凑人、30 米内敌人靠近即消失、50 米内禁止放置的三层距离。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}.xs{font-size:12px}</style>
<text x="40" y="42" class="t" text-anchor="start">队包：15 放、30 踩、50 禁</text>
<circle cx="330" cy="245" r="175" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="9 7"/>
<circle cx="330" cy="245" r="112" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="330" cy="245" r="56" fill="#eaf5ef" stroke="#2f7d5b" stroke-width="2"/>
<path d="M330 218 v30" stroke="#2f7d5b" stroke-width="4"/>
<path d="M330 218 l18 9 -18 9z" fill="#2f7d5b"/>
<text x="330" y="276" class="s" text-anchor="middle" fill="#2f7d5b">队包</text>
<text x="330" y="160" class="s" text-anchor="middle" fill="#b42318">30 米</text>
<text x="330" y="100" class="s" text-anchor="middle" fill="#d97706">50 米</text>
<text x="330" y="208" class="s" text-anchor="middle" fill="#2f7d5b">15 米</text>

<rect x="540" y="88" width="230" height="82" rx="10" fill="#ffffff" stroke="#2f7d5b" stroke-width="2"/>
<text x="556" y="114" class="l" text-anchor="start" fill="#2f7d5b">15 米：凑人</text>
<text x="556" y="138" class="s" text-anchor="start">步兵队长 1 名队员</text>
<text x="556" y="158" class="s" text-anchor="start">载具 / 飞行员队长 3 名</text>

<rect x="540" y="184" width="230" height="82" rx="10" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<text x="556" y="210" class="l" text-anchor="start" fill="#b42318">30 米：消失</text>
<text x="556" y="234" class="s" text-anchor="start">敌人或敌方载具进入</text>
<text x="556" y="254" class="s" text-anchor="start">队包立刻没了</text>

<rect x="540" y="280" width="230" height="82" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="556" y="306" class="l" text-anchor="start" fill="#b45309">50 米：禁放</text>
<text x="556" y="330" class="s" text-anchor="start">放不下来，进入 120 秒冷却</text>
<text x="556" y="350" class="s" text-anchor="start">别在原地反复点</text>

<text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">成功后 150 秒放置冷却；复活 60 秒一波；每队只有 1 个队包。</text>
<text x="40" y="440" class="xs" text-anchor="start" fill="#5b6875">队包不是第二个兵站：离 HAB 太近、方向一致，会被一起踩掉。</text>
</svg>
