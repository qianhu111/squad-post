<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">步载协同与盲区</title><desc id="dsc">装甲车前后存在盲区，步兵在车外两侧补观察并在下车后展开。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">步载协同：车看远处，步兵补盲区</text><rect x="300" y="165" width="200" height="120" rx="18" fill="#dce8ee" stroke="#1f5d78" stroke-width="3"/><text x="400" y="232" class="l" text-anchor="middle" fill="#1f5d78">步战车 / 装甲车</text><path d="M500 190 C570 190 590 260 500 260 Z" fill="#b42318" opacity="0.16"/><path d="M300 190 C230 190 210 260 300 260 Z" fill="#b42318" opacity="0.16"/><text x="590" y="210" class="s" text-anchor="start" fill="#b42318">车体盲区</text><text x="210" y="210" class="s" text-anchor="end" fill="#b42318">车体盲区</text><circle cx="260" cy="130" r="13" fill="#1f5d78"/><circle cx="540" cy="130" r="13" fill="#1f5d78"/><circle cx="260" cy="320" r="13" fill="#1f5d78"/><circle cx="540" cy="320" r="13" fill="#1f5d78"/><text x="260" y="112" class="s" text-anchor="middle" fill="#1f5d78">步兵观察</text><text x="540" y="112" class="s" text-anchor="middle" fill="#1f5d78">步兵观察</text><line x1="300" y1="300" x2="240" y2="300" stroke="#1f5d78" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><line x1="500" y1="300" x2="560" y2="300" stroke="#1f5d78" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><text x="400" y="330" class="s" text-anchor="middle" fill="#1f5d78">下车后先占两侧</text><text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">车不能替你占点，也不能替你看所有角度；步兵下车后先建立观察和火力。</text>
</svg>
