<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">综合演练任务链</title>
<desc id="dsc">准备、进入、接敌、占点、抗反扑、复盘六个阶段，以及队长阵亡、HAB 被压、补给中断三个注入点和现场证据要求。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker>
</defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.xs{font-size:11px}.l{font-size:15px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">综合演练：六段任务链，三个注入点</text>

<rect x="30" y="88" width="108" height="80" rx="10" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/>
<text x="84" y="114" class="l" text-anchor="middle" fill="#1f5d78">准备</text>
<text x="84" y="136" class="xs" text-anchor="middle" fill="#5b6875">任务书 / 分工</text>
<text x="84" y="156" class="xs" text-anchor="middle" fill="#5b6875">10 分钟</text>

<rect x="148" y="88" width="108" height="80" rx="10" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/>
<text x="202" y="114" class="l" text-anchor="middle" fill="#1f5d78">进入</text>
<text x="202" y="136" class="xs" text-anchor="middle" fill="#5b6875">下车 / 集结</text>
<text x="202" y="156" class="xs" text-anchor="middle" fill="#5b6875">10 分钟</text>

<rect x="266" y="88" width="108" height="80" rx="10" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/>
<text x="320" y="114" class="l" text-anchor="middle" fill="#1f5d78">接敌</text>
<text x="320" y="136" class="xs" text-anchor="middle" fill="#5b6875">观察 / 报点</text>
<text x="320" y="156" class="xs" text-anchor="middle" fill="#5b6875">15 分钟</text>

<rect x="384" y="88" width="108" height="80" rx="10" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/>
<text x="438" y="114" class="l" text-anchor="middle" fill="#1f5d78">占点</text>
<text x="438" y="136" class="xs" text-anchor="middle" fill="#5b6875">清楼 / 分区</text>
<text x="438" y="156" class="xs" text-anchor="middle" fill="#5b6875">15 分钟</text>

<rect x="502" y="88" width="108" height="80" rx="10" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/>
<text x="556" y="114" class="l" text-anchor="middle" fill="#1f5d78">抗反扑</text>
<text x="556" y="136" class="xs" text-anchor="middle" fill="#5b6875">反载具 / 撤退</text>
<text x="556" y="156" class="xs" text-anchor="middle" fill="#5b6875">15 分钟</text>

<rect x="620" y="88" width="108" height="80" rx="10" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/>
<text x="674" y="114" class="l" text-anchor="middle" fill="#1f5d78">复盘</text>
<text x="674" y="136" class="xs" text-anchor="middle" fill="#5b6875">五栏 / 评分</text>
<text x="674" y="156" class="xs" text-anchor="middle" fill="#5b6875">10 分钟</text>

<path d="M140 128 L146 128" fill="none" stroke="#1f5d78" stroke-width="2.5" marker-end="url(#ar-blue)"/>
<path d="M258 128 L264 128" fill="none" stroke="#1f5d78" stroke-width="2.5" marker-end="url(#ar-blue)"/>
<path d="M376 128 L382 128" fill="none" stroke="#1f5d78" stroke-width="2.5" marker-end="url(#ar-blue)"/>
<path d="M494 128 L500 128" fill="none" stroke="#1f5d78" stroke-width="2.5" marker-end="url(#ar-blue)"/>
<path d="M612 128 L618 128" fill="none" stroke="#1f5d78" stroke-width="2.5" marker-end="url(#ar-blue)"/>

<path d="M320 204 L320 172" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="266" y="208" width="108" height="36" rx="8" fill="#fdecea" stroke="#b42318"/>
<text x="320" y="231" class="xs" text-anchor="middle" fill="#b42318">队长阵亡</text>

<path d="M438 204 L438 172" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="384" y="208" width="108" height="36" rx="8" fill="#fff5e6" stroke="#d97706"/>
<text x="438" y="231" class="xs" text-anchor="middle" fill="#d97706">HAB 被压</text>

<path d="M556 204 L556 172" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="502" y="208" width="108" height="36" rx="8" fill="#fdecea" stroke="#b42318"/>
<text x="556" y="231" class="xs" text-anchor="middle" fill="#b42318">补给中断</text>

<rect x="30" y="275" width="698" height="70" rx="10" fill="#ffffff" stroke="#dfe6ee"/>
<text x="48" y="301" class="s" text-anchor="start" fill="#1f5d78">评分证据</text>
<text x="48" y="323" class="xs" text-anchor="start" fill="#5b6875">录像片段 · 频道原话 · 到位与占点时间 · 票数变化 · 任务卡与复盘记录</text>

<rect x="30" y="365" width="698" height="44" rx="10" fill="#eef7f2" stroke="#2f7d5b"/>
<text x="48" y="392" class="xs" text-anchor="start" fill="#2f7d5b">一个主目标 · 三个注入 · 每项都有证据；L1 单线、L2 双线、L3 指挥中断，升级一次只加一个变量。</text>
</svg>
