<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">楼层清理顺序</title><desc id="dsc">一楼、楼上、地下室依次清理；楼梯口一人架枪一人移动，平台不停留。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.m{font-size:15px}.l{font-size:16px;font-weight:700}.t{font-size:21px;font-weight:800}</style>
<text x="40" y="40" class="t">从下往上清，地下室最后</text>
<rect x="80" y="80" width="420" height="55" rx="6" fill="#e8e2d6" stroke="#8a7a63" stroke-width="2"/>
<text x="105" y="114" class="l" fill="#7a6a53">屋顶</text>
<text x="210" y="114" class="s">视野最好，也最暴露；有掩体才短时观察</text>
<rect x="80" y="145" width="420" height="70" rx="6" fill="#dce8ee" stroke="#1f5d78" stroke-width="2"/>
<text x="105" y="180" class="l" fill="#1f5d78">二楼</text>
<text x="210" y="176" class="s">窗口交叉火力；楼梯口架枪</text>
<text x="210" y="198" class="s" fill="#5b6875">平台不停留超过两秒</text>
<rect x="80" y="225" width="420" height="70" rx="6" fill="#e7f0ea" stroke="#2f7d5b" stroke-width="2"/>
<text x="105" y="260" class="l" fill="#2f7d5b">一楼</text>
<text x="210" y="256" class="s">先拿立足点和出入口，清门后、近角</text>
<text x="210" y="278" class="s" fill="#5b6875">不要一进门就全队上楼</text>
<rect x="80" y="305" width="420" height="70" rx="6" fill="#f5e3e0" stroke="#b42318" stroke-width="2"/>
<text x="105" y="340" class="l" fill="#b42318">地下室</text>
<text x="210" y="336" class="s">先投雷、先确认出口；通常是死胡同</text>
<text x="210" y="358" class="s" fill="#5b6875">电台/兵站放这里，要留人守口</text>
<line x1="540" y1="100" x2="540" y2="350" stroke="#5b6875" stroke-width="2"/>
<line x1="540" y1="350" x2="540" y2="100" stroke="#5b6875" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="558" y="220" class="s" fill="#1f5d78">清理方向</text>
<text x="558" y="244" class="s" fill="#5b6875">1 → 2 → 3</text>
<text x="558" y="268" class="s" fill="#5b6875">不跳房间</text>
<rect x="540" y="365" width="220" height="45" rx="7" fill="#ffffff" stroke="#c7d3dc" stroke-width="2"/>
<text x="558" y="393" class="s" fill="#b42318">地下室不是最后堡垒</text>
<g transform="translate(170,385)">
<rect x="0" y="0" width="120" height="10" fill="#8a7a63"/>
<rect x="0" y="10" width="120" height="8" fill="#b9a98f"/>
</g>
<text x="40" y="435" class="s" fill="#5b6875">上楼：一人架转角，一人快速占平台；下楼：先投雷，再贴墙下行。</text>
</svg>
