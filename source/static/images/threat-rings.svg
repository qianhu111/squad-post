<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">威胁圈与锋线腰线</title><desc id="dsc">以自己为圆心画出安全区、观察区和交火区，并标出锋线与腰线。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">威胁圈：先判断谁能在多远处打到你</text><circle cx="230" cy="315" r="230" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="8 7"/><circle cx="230" cy="315" r="150" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 7"/><circle cx="230" cy="315" r="72" fill="#eaf5ef" stroke="#2f7d5b" stroke-width="2"/><circle cx="230" cy="315" r="10" fill="#1f5d78"/><text x="230" y="352" class="s" text-anchor="middle">你</text><text x="230" y="275" class="s" text-anchor="middle" fill="#2f7d5b">安全区</text><text x="230" y="190" class="s" text-anchor="middle" fill="#d97706">观察区</text><text x="230" y="100" class="s" text-anchor="middle" fill="#b42318">交火区</text><path d="M60 250 C230 170 420 150 745 105" fill="none" stroke="#5b6875" stroke-width="2" stroke-dasharray="10 6"/><text x="610" y="86" class="s" text-anchor="middle" fill="#5b6875">锋线</text><line x1="430" y1="315" x2="760" y2="315" stroke="#5b6875" stroke-width="2" stroke-dasharray="4 6"/><text x="706" y="340" class="s" text-anchor="middle" fill="#5b6875">腰线</text><circle cx="640" cy="140" r="11" fill="#b42318"/><text x="660" y="145" class="s" text-anchor="start">敌方火力</text><text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">内圈先保命，中圈先观察，外圈才考虑交火。</text>
</svg>
