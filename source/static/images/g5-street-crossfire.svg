<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">街道交叉火力与过街</title><desc id="dsc">两侧建筑窗口形成交叉射界，过街用烟幕分两到三人一组，先到位再补烟。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.m{font-size:15px}.l{font-size:16px;font-weight:700}.t{font-size:21px;font-weight:800}</style>
<text x="40" y="40" class="t">街道是杀伤区：两侧打，中间过</text>
<rect x="40" y="75" width="720" height="300" rx="12" fill="#e9eef1" stroke="#c7d3dc" stroke-width="2"/>
<rect x="40" y="185" width="720" height="95" fill="#dfe8ee"/>
<text x="60" y="282" class="s" fill="#5b6875">街道（无掩体，暴露 30 米以上）</text>
<g fill="#e8e2d6" stroke="#8a7a63" stroke-width="2">
<rect x="70" y="85" width="190" height="85" rx="5"/>
<rect x="70" y="295" width="190" height="65" rx="5"/>
<rect x="540" y="85" width="200" height="85" rx="5"/>
<rect x="540" y="295" width="200" height="65" rx="5"/>
</g>
<text x="165" y="132" class="s" text-anchor="middle" fill="#7a6a53">西侧楼（二层窗口）</text>
<text x="640" y="132" class="s" text-anchor="middle" fill="#7a6a53">东侧楼（二层窗口）</text>
<circle cx="150" cy="160" r="10" fill="#2f7d5b"/><circle cx="630" cy="160" r="10" fill="#2f7d5b"/>
<line x1="160" y1="165" x2="520" y2="260" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-green)"/>
<line x1="620" y1="165" x2="260" y2="260" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-green)"/>
<text x="340" y="215" class="s" fill="#2f7d5b">交叉射界</text>
<circle cx="320" cy="240" r="20" fill="#b42318" opacity="0.18"/><text x="320" y="245" class="s" text-anchor="middle" fill="#b42318">敌</text>
<circle cx="420" cy="200" r="18" fill="#d97706" opacity="0.35"/><text x="420" y="205" class="s" text-anchor="middle" fill="#d97706">烟</text>
<circle cx="470" cy="235" r="16" fill="#d97706" opacity="0.35"/><text x="470" y="240" class="s" text-anchor="middle" fill="#d97706">烟</text>
<circle cx="300" cy="255" r="8" fill="#1f5d78"/><circle cx="330" cy="245" r="8" fill="#1f5d78"/>
<line x1="230" y1="330" x2="300" y2="265" stroke="#1f5d78" stroke-width="3" marker-end="url(#ar-blue)"/>
<text x="225" y="355" class="s" fill="#1f5d78">两到三人一组，间隔 5–10 米</text>
<rect x="40" y="390" width="720" height="42" rx="8" fill="#ffffff" stroke="#c7d3dc" stroke-width="2"/>
<text x="60" y="417" class="s" fill="#b42318">先分射界再谈火力：东段、西段、分界物说清楚；队友过街时对应扇区停火。</text>
<text x="40" y="438" class="s" fill="#5b6875">烟要投在敌人与自己之间；没有烟就走墙根、车体、路障，逐段移动。</text>
</svg>
