<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">复盘闭环</title><desc id="dsc">从事实、判断、动作、结果到下次改进的五步循环。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">复盘闭环：事实 → 判断 → 动作 → 结果 → 下次改什么</text><circle cx="400" cy="235" r="145" fill="none" stroke="#dfe6ee" stroke-width="2" stroke-dasharray="6 6"/><path d="M400 90 A145 145 0 1 1 399 90" fill="none" stroke="#1f5d78" stroke-width="3" marker-end="url(#ar-blue)"/><circle cx="400" cy="235" r="54" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/><text x="400" y="242" class="l" text-anchor="middle" fill="#1f5d78">复盘</text><circle cx="400" cy="90" r="34" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="400" y="96" class="s" text-anchor="middle">事实</text><circle cx="538" cy="190" r="34" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="538" y="196" class="s" text-anchor="middle">判断</text><circle cx="485" cy="352" r="34" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="485" y="358" class="s" text-anchor="middle">动作</text><circle cx="315" cy="352" r="40" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="315" y="358" class="s" text-anchor="middle">结果</text><circle cx="262" cy="190" r="46" fill="#ffffff" stroke="#1f5d78" stroke-width="2"/><text x="262" y="196" class="s" text-anchor="middle">下次改</text><text x="40" y="425" class="s" text-anchor="start" fill="#5b6875">复盘不是追责；每一轮只留下一个下一局能执行的动作。</text>
</svg>
