<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">迫击炮横向刻度换算</title><desc id="dsc">社区经验刻度：4.16 约 10 米，8.3 约 20 米，12.5 约 30 米，16.6 约 40 米，21 约 50 米。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.m{font-size:15px}.l{font-size:17px;font-weight:700}.t{font-size:21px;font-weight:800}</style>
<text x="40" y="40" class="t">横向偏 50 米，大约 21 个刻度</text>
<line x1="70" y1="200" x2="730" y2="200" stroke="#5b6875" stroke-width="3"/>
<g stroke="#5b6875" stroke-width="2">
<line x1="70" y1="190" x2="70" y2="210"/>
<line x1="190" y1="185" x2="190" y2="215"/>
<line x1="310" y1="185" x2="310" y2="215"/>
<line x1="430" y1="185" x2="430" y2="215"/>
<line x1="550" y1="185" x2="550" y2="215"/>
<line x1="670" y1="185" x2="670" y2="215"/>
</g>
<text x="70" y="235" class="s" text-anchor="middle">0</text>
<text x="190" y="235" class="s" text-anchor="middle">4.16</text>
<text x="310" y="235" class="s" text-anchor="middle">8.3</text>
<text x="430" y="235" class="s" text-anchor="middle">12.5</text>
<text x="550" y="235" class="s" text-anchor="middle">16.6</text>
<text x="670" y="235" class="s" text-anchor="middle">21</text>
<text x="70" y="178" class="s" text-anchor="middle" fill="#d97706">0 米</text>
<text x="190" y="178" class="s" text-anchor="middle" fill="#d97706">10 米</text>
<text x="310" y="178" class="s" text-anchor="middle" fill="#d97706">20 米</text>
<text x="430" y="178" class="s" text-anchor="middle" fill="#d97706">30 米</text>
<text x="550" y="178" class="s" text-anchor="middle" fill="#d97706">40 米</text>
<text x="670" y="178" class="s" text-anchor="middle" fill="#d97706">50 米</text>
<rect x="380" y="265" width="310" height="86" rx="10" fill="#f8ecd9" stroke="#d97706" stroke-width="2"/>
<text x="400" y="292" class="m" fill="#d97706">精调用小刻度</text>
<text x="400" y="318" class="s">落点进入 30 米内：优先 12.5</text>
<text x="400" y="340" class="s">不足 10 米：不修，转效力射</text>
<rect x="70" y="265" width="290" height="86" rx="10" fill="#eef3f6" stroke="#c7d3dc" stroke-width="2"/>
<text x="88" y="292" class="m" fill="#1f5d78">粗调用大刻度</text>
<text x="88" y="318" class="s">偏 50 米：21，先收拢到目标周边</text>
<text x="88" y="340" class="s">偏 100 米以上：重报距离，不微调</text>
<rect x="70" y="370" width="660" height="42" rx="8" fill="#f5e3e0" stroke="#b42318" stroke-width="2"/>
<text x="88" y="397" class="s" fill="#b42318">社区经验值，以游戏内为准：1 刻度约 2.4 米，版本、地图、炮型和瞄具设置都会影响落点。</text>
<text x="40" y="438" class="s" fill="#5b6875">刻度只修横向；射程用米或档位。先粗后细，先大后小。</text>
</svg>
