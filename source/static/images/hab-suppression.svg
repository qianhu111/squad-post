<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">HAB 压制阶梯</title><desc id="dsc">HAB 周围敌人数量与距离决定压制范围，最多 9 人 90 米。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">HAB 压制：人数越多，压制圈越大</text><circle cx="330" cy="270" r="200" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="8 7"/><circle cx="330" cy="270" r="133" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 7"/><circle cx="330" cy="270" r="44" fill="none" stroke="#5b6875" stroke-width="2" stroke-dasharray="6 5"/><rect x="305" y="245" width="50" height="50" rx="6" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2"/><text x="330" y="275" class="s" text-anchor="middle">HAB</text><text x="330" y="334" class="s" text-anchor="middle" fill="#5b6875">20 米</text><text x="470" y="270" class="s" text-anchor="start" fill="#d97706">60 米</text><text x="537" y="270" class="s" text-anchor="start" fill="#b42318">90 米</text><circle cx="330" cy="226" r="9" fill="#b42318"/><text x="330" y="213" class="s" text-anchor="middle" fill="#b42318">2 人</text><circle cx="463" cy="270" r="9" fill="#b42318"/><text x="463" y="294" class="s" text-anchor="middle" fill="#b42318">4 人</text><circle cx="330" cy="137" r="9" fill="#b42318"/><text x="330" y="125" class="s" text-anchor="middle" fill="#b42318">6 人</text><circle cx="530" cy="270" r="9" fill="#b42318"/><text x="530" y="294" class="s" text-anchor="middle" fill="#b42318">9 人</text><text x="590" y="120" class="s" text-anchor="start">2 人 20 米起</text><text x="590" y="146" class="s" text-anchor="start">每多 1 人 +10 米</text><text x="590" y="172" class="s" text-anchor="start">最高 9 人 90 米</text><text x="590" y="212" class="s" text-anchor="start" fill="#b42318">倒地敌人、载具内敌人</text><text x="590" y="234" class="s" text-anchor="start" fill="#b42318">不计入压制</text><text x="590" y="274" class="s" text-anchor="start" fill="#d97706">解除后 30 秒恢复复活</text><text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">压制没解除就复活，出来也是送票。</text>
</svg>
