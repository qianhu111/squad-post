<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">FOB 间距与建造圈</title><desc id="dsc">两个 FOB 电台至少相距 400 米，各自拥有 150 米建造圈。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">FOB 选址：两个圈，一条线</text><circle cx="220" cy="255" r="130" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2" stroke-dasharray="8 6" opacity="0.75"/><rect x="198" y="235" width="44" height="42" rx="6" fill="#1f5d78"/><text x="220" y="225" class="s" text-anchor="middle">FOB A</text><rect x="170" y="286" width="30" height="20" rx="3" fill="#d97706"/><text x="185" y="321" class="s" text-anchor="middle">HAB</text><rect x="244" y="286" width="30" height="20" rx="3" fill="#2f7d5b"/><text x="259" y="321" class="s" text-anchor="middle">弹药</text><rect x="210" y="160" width="20" height="20" rx="3" fill="#b42318"/><text x="220" y="152" class="s" text-anchor="middle">维修</text><circle cx="580" cy="255" r="130" fill="#e8f2f6" stroke="#1f5d78" stroke-width="2" stroke-dasharray="8 6" opacity="0.75"/><rect x="558" y="235" width="44" height="42" rx="6" fill="#1f5d78"/><text x="580" y="225" class="s" text-anchor="middle">FOB B</text><rect x="530" y="286" width="30" height="20" rx="3" fill="#d97706"/><text x="545" y="321" class="s" text-anchor="middle">HAB</text><rect x="604" y="286" width="30" height="20" rx="3" fill="#2f7d5b"/><text x="619" y="321" class="s" text-anchor="middle">弹药</text><rect x="570" y="160" width="20" height="20" rx="3" fill="#b42318"/><text x="580" y="152" class="s" text-anchor="middle">维修</text><line x1="352" y1="255" x2="448" y2="255" stroke="#b42318" stroke-width="3" marker-end="url(#ar-red)"/><text x="400" y="240" class="s" text-anchor="middle" fill="#b42318">≥400 米</text><text x="40" y="410" class="s" text-anchor="start" fill="#5b6875">两个 FOB 的建造圈不要连成一片；电台被毁 −20 票，主动拆不扣票。</text>
</svg>
