<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">房间清理顺序</title><desc id="dsc">从门口进入房间后按远角、近角、侧后顺序清理，门口是致命漏斗。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">房间清理：先远角，后近角，不在门口停</text><rect x="140" y="90" width="520" height="270" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="4"/><rect x="140" y="330" width="220" height="30" fill="#f7f9fb"/><rect x="440" y="330" width="220" height="30" fill="#f7f9fb"/><polygon points="360,330 440,330 415,285 385,285" fill="#b42318" opacity="0.14"/><circle cx="375" cy="392" r="11" fill="#1f5d78"/><circle cx="405" cy="392" r="11" fill="#1f5d78"/><circle cx="435" cy="392" r="11" fill="#1f5d78"/><line x1="405" y1="380" x2="405" y2="345" stroke="#1f5d78" stroke-width="3" marker-end="url(#ar-blue)"/><text x="170" y="120" class="l" fill="#b42318">1</text><text x="620" y="120" class="l" fill="#b42318">2</text><text x="170" y="345" class="l" fill="#b42318">3</text><text x="620" y="345" class="l" fill="#b42318">4</text><path d="M405 330 C330 250 260 160 190 130" fill="none" stroke="#1f5d78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><path d="M405 300 C470 220 560 160 615 130" fill="none" stroke="#1f5d78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><text x="400" y="310" class="s" text-anchor="middle" fill="#b42318">致命漏斗</text><text x="40" y="430" class="s" text-anchor="start" fill="#5b6875">门口停留越久越危险；进房前先分工看远角、近角和身后。</text>
</svg>
