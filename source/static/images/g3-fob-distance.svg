<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">FOB 与目标点的距离梯度</title><desc id="dsc">FOB 离目标点 50 米内、100 米内、100 到 200 米、200 米以上的发现速度与适用类型。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:13px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}.xs{font-size:12px}</style>
<text x="40" y="42" class="t" text-anchor="start">FOB 离目标点多远：发现梯度</text>

<circle cx="120" cy="200" r="18" fill="#b42318"/>
<text x="120" y="205" class="s" text-anchor="middle" fill="#ffffff">点</text>
<text x="120" y="238" class="s" text-anchor="middle" fill="#5b6875">目标点</text>

<rect x="152" y="160" width="120" height="80" fill="#fde8e6" stroke="#b42318" stroke-width="2"/>
<text x="212" y="192" class="l" text-anchor="middle" fill="#b42318">50 米内</text>
<text x="212" y="214" class="s" text-anchor="middle">约 1 分钟被发现</text>
<text x="212" y="232" class="s" text-anchor="middle">等于明牌</text>

<rect x="272" y="160" width="130" height="80" fill="#fff2dd" stroke="#d97706" stroke-width="2"/>
<text x="337" y="192" class="l" text-anchor="middle" fill="#b45309">50–100 米</text>
<text x="337" y="214" class="s" text-anchor="middle">要花时间搜索</text>
<text x="337" y="232" class="s" text-anchor="middle">适合进攻 FOB</text>

<rect x="402" y="160" width="200" height="80" fill="#eaf5ef" stroke="#2f7d5b" stroke-width="2"/>
<text x="502" y="192" class="l" text-anchor="middle" fill="#2f7d5b">100–200 米</text>
<text x="502" y="214" class="s" text-anchor="middle">隐蔽与展开的折中</text>
<text x="502" y="232" class="s" text-anchor="middle">多数进攻 FOB 的推荐带</text>

<rect x="602" y="160" width="150" height="80" fill="#e6ebf0" stroke="#5b6875" stroke-width="2"/>
<text x="677" y="192" class="l" text-anchor="middle" fill="#5b6875">200 米外</text>
<text x="677" y="214" class="s" text-anchor="middle">更隐蔽</text>
<text x="677" y="232" class="s" text-anchor="middle">但复活跑路更久</text>

<line x1="120" y1="285" x2="760" y2="285" stroke="#5b6875" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="120" y="310" class="s" text-anchor="middle" fill="#5b6875">0 m</text>
<text x="272" y="310" class="s" text-anchor="middle" fill="#5b6875">50</text>
<text x="402" y="310" class="s" text-anchor="middle" fill="#5b6875">100</text>
<text x="602" y="310" class="s" text-anchor="middle" fill="#5b6875">200</text>
<text x="745" y="310" class="s" text-anchor="middle" fill="#5b6875">250 m</text>

<rect x="40" y="338" width="720" height="82" rx="12" fill="#ffffff" stroke="#dfe6ee"/>
<text x="60" y="364" class="l" text-anchor="start" fill="#1f5d78">两个不要</text>
<text x="60" y="388" class="s" text-anchor="start" fill="#b42318">不要把电台放在两个据点之间的直线上——那是双方增援的必经路线，被发现几乎是必然。</text>
<text x="60" y="410" class="s" text-anchor="start" fill="#5b6875">不要为了隐蔽放到补给车进不来的地方；30 米卸货距离不满足，位置再好也只是摆设。</text>
<text x="40" y="440" class="xs" text-anchor="start" fill="#5b6875">发现时间为社区经验，具体受地形、植被、敌方观察习惯影响。</text>
</svg>
