<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ttl dsc">
<title id="ttl">1-2 与 2-1 队形</title><desc id="dsc">两种三人队形的站位、推进方向和适用场景。</desc>
<rect width="800" height="450" rx="16" fill="#f7f9fb"/>
<defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6875"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f5d78"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b42318"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d97706"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f7d5b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#16212b}.muted{fill:#5b6875}.s{font-size:14px}.l{font-size:16px;font-weight:700}.t{font-size:20px;font-weight:800}</style>
<text x="40" y="42" class="t" text-anchor="start">1-2 与 2-1：队形按视线和威胁方向选</text><rect x="30" y="80" width="350" height="300" rx="14" fill="#ffffff" stroke="#dfe6ee"/><text x="205" y="112" class="l" text-anchor="middle">1-2 队形</text><circle cx="205" cy="160" r="15" fill="#1f5d78"/><text x="205" y="166" class="s" text-anchor="middle" fill="#ffffff">1</text><circle cx="145" cy="285" r="15" fill="#1f5d78"/><text x="145" y="291" class="s" text-anchor="middle" fill="#ffffff">2</text><circle cx="265" cy="285" r="15" fill="#1f5d78"/><text x="265" y="291" class="s" text-anchor="middle" fill="#ffffff">3</text><line x1="205" y1="180" x2="205" y2="235" stroke="#1f5d78" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><line x1="145" y1="265" x2="145" y2="220" stroke="#5b6875" stroke-width="3" stroke-dasharray="4 5" marker-end="url(#ar-gray)"/><line x1="265" y1="265" x2="265" y2="220" stroke="#5b6875" stroke-width="3" stroke-dasharray="4 5" marker-end="url(#ar-gray)"/><text x="205" y="350" class="s" text-anchor="middle" fill="#5b6875">前方观察，后方火力</text><rect x="420" y="80" width="350" height="300" rx="14" fill="#ffffff" stroke="#dfe6ee"/><text x="595" y="112" class="l" text-anchor="middle">2-1 队形</text><circle cx="545" cy="165" r="15" fill="#1f5d78"/><text x="545" y="171" class="s" text-anchor="middle" fill="#ffffff">1</text><circle cx="645" cy="165" r="15" fill="#1f5d78"/><text x="645" y="171" class="s" text-anchor="middle" fill="#ffffff">2</text><circle cx="595" cy="290" r="15" fill="#1f5d78"/><text x="595" y="296" class="s" text-anchor="middle" fill="#ffffff">3</text><line x1="545" y1="185" x2="545" y2="235" stroke="#5b6875" stroke-width="3" stroke-dasharray="4 5" marker-end="url(#ar-gray)"/><line x1="645" y1="185" x2="645" y2="235" stroke="#5b6875" stroke-width="3" stroke-dasharray="4 5" marker-end="url(#ar-gray)"/><line x1="595" y1="270" x2="595" y2="225" stroke="#1f5d78" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar-blue)"/><text x="595" y="350" class="s" text-anchor="middle" fill="#5b6875">双人前沿，一人支援</text><text x="40" y="420" class="s" text-anchor="start" fill="#5b6875">狭窄地形收紧，开阔地拉开；不要为了整齐牺牲射界。</text>
</svg>
